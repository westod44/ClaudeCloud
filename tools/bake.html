const log = document.getElementById('log');
const say = s => { log.textContent += '\n' + s; };
function toCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function putLayer(ctx, data, w, h, x, y) { ctx.putImageData(new ImageData(data, w, h), x, y); }

async function bake() {
  const out = { assets: [], terrain: {}, timing: {} };
  const t0 = performance.now();
  for (const it of LIST) {
    const t1 = performance.now();
    const rec = { name: it.name, category: it.cat, description: it.desc, footprint: it.fp || [1, 1], blocks: !!it.block };
    if (it.unit) {
      const dirs = STYLE.sprites.rendered, nWalk = STYLE.sprites.animation.walk.frames, nAtt = STYLE.sprites.animation.attack.frames;
      const frames = 1 + nWalk + nAtt + 1;
      const deadModel = () => { const base = it.make(null); return it.deadScale ? M.scaled(M.fallen(M.hollow(null), it.dead[0] / it.deadScale, it.dead[1] / it.deadScale), it.deadScale) : M.fallen(base, it.dead[0], it.dead[1]); };
      let box = null; const probe = it.make(null), dprobe = deadModel();
      for (const d of dirs) { box = R3.unionBox(box, R3.screenBox(R3.worldBounds(probe.bounds, STYLE.sprites.facing[d]))); box = R3.unionBox(box, R3.screenBox(R3.worldBounds(dprobe.bounds, STYLE.sprites.facing[d]))); }
      const bodyC = toCanvas(box.w * frames, box.h * dirs.length), shC = toCanvas(box.w * frames, box.h * dirs.length);
      const bx = bodyC.getContext('2d'), sx = shC.getContext('2d');
      dirs.forEach((d, r) => { for (let f = 0; f < frames; f++) {
        let mdl;
        if (f === 0) mdl = it.make(null);
        else if (f <= nWalk) mdl = it.make((f - 1) / nWalk * Math.PI * 2);
        else if (f <= nWalk + nAtt) mdl = it.make(null, { attack: (f - nWalk - 0.5) / nAtt });
        else mdl = deadModel();
        const res = R3.render(mdl, { angle: STYLE.sprites.facing[d], box });
        putLayer(bx, res.body, res.w, res.h, f * box.w, r * box.h); putLayer(sx, res.shadow, res.w, res.h, f * box.w, r * box.h);
      } });
      Object.assign(rec, { w: box.w, h: box.h, ax: -box.x, ay: -box.y, dirs, mirrored: STYLE.sprites.mirrored, frames, layout: STYLE.sprites.animation.unitLayout,
        anim: { idle: [0, 1], walk: [1, nWalk], attack: [1 + nWalk, nAtt], dead: [1 + nWalk + nAtt, 1] }, fps: STYLE.sprites.animation.walk.fps, speed: it.speed, body: bodyC.toDataURL(), shadow: shC.toDataURL() });
    } else if (it.icon) {
      const mdl = M.scaled(M.icon(it.icon), 3), box = R3.screenBox(mdl.bounds);
      const res = R3.render(mdl, { box });
      let x0 = res.w, y0 = res.h, x1 = 0, y1 = 0; // crop to the opaque body
      for (let y = 0; y < res.h; y++) for (let x = 0; x < res.w; x++) if (res.body[(y * res.w + x) * 4 + 3]) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
      x0 = Math.max(0, x0 - 2); y0 = Math.max(0, y0 - 2); x1 = Math.min(res.w - 1, x1 + 2); y1 = Math.min(res.h - 1, y1 + 2);
      const full = toCanvas(res.w, res.h); putLayer(full.getContext('2d'), res.body, res.w, res.h, 0, 0);
      const c = toCanvas(x1 - x0 + 1, y1 - y0 + 1); c.getContext('2d').drawImage(full, -x0, -y0);
      Object.assign(rec, { w: c.width, h: c.height, ax: res.ax - x0, ay: res.ay - y0, frames: 1, body: c.toDataURL(), shadow: null });
    } else {
      const frames = it.frames || 1;
      let box = null; const probe = it.make(0);
      box = R3.screenBox(probe.bounds);
      const bodyC = toCanvas(box.w * frames, box.h), shC = toCanvas(box.w * frames, box.h);
      for (let f = 0; f < frames; f++) {
        const res = R3.render(it.make(f), { box });
        putLayer(bodyC.getContext('2d'), res.body, res.w, res.h, f * box.w, 0); putLayer(shC.getContext('2d'), res.shadow, res.w, res.h, f * box.w, 0);
      }
      Object.assign(rec, { w: box.w, h: box.h, ax: -box.x, ay: -box.y, frames, fps: it.fps || 0, body: bodyC.toDataURL(), shadow: shC.toDataURL() });
    }
    rec.bakeMs = Math.round(performance.now() - t1);
    out.assets.push(rec); say(`${it.name.padEnd(18)} ${rec.w}x${rec.h} x${rec.frames}${rec.dirs ? ' x' + rec.dirs.length + 'dirs' : ''}  ${rec.bakeMs}ms`);
    await new Promise(r => setTimeout(r, 0));
  }
  for (const id of TERRAINTEX.types) {
    const t1 = performance.now();
    const c = toCanvas(TERRAINTEX.size, TERRAINTEX.size); putLayer(c.getContext('2d'), TERRAINTEX.make(id), TERRAINTEX.size, TERRAINTEX.size, 0, 0);
    out.terrain[id] = c.toDataURL(); say(`terrain ${id.padEnd(12)} ${Math.round(performance.now() - t1)}ms`);
    await new Promise(r => setTimeout(r, 0));
  }
  out.timing.totalMs = Math.round(performance.now() - t0);
  out.palette = { colors: PAL.colors, names: PAL.PALETTE.entries.map(e => e.name), used: PAL.used, jasc: PAL.toJascPal() };
  say('done in ' + out.timing.totalMs + 'ms');
  window.BAKE_RESULT = out;
}
// allow baking a subset for previews: bake.html#oak_1,explorer
if (location.hash.length > 1) { const keep = location.hash.slice(1).split(','); LIST.splice(0, LIST.length, ...LIST.filter(i => keep.includes(i.name))); }
bake().catch(e => { say('ERROR ' + e.stack); window.BAKE_ERROR = String(e.stack); });
