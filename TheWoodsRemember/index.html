<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Woods Remember</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="view"></canvas>
<div id="hud">
  <div id="dot"></div>
  <div id="objective"></div>
  <div id="toast"></div>
  <div id="captions"></div>
  <div id="cue"></div>
  <div id="prompt"></div>
  <div id="hold"><div></div></div>
  <div id="progress"></div>
  <div id="status"></div>
  <div id="battery"></div>
  <div id="saved">Saved</div>
  <div id="jping">Journal updated</div>
  <div id="card"></div>
  <pre id="debug"></pre>
</div>
<div id="panel" class="panel hidden"></div>
<div id="menu" class="hidden"></div>
<div id="fade"></div>
<div id="credits-roll"></div>
<div id="resume" class="hidden"><div>Click to continue</div><small>Esc pauses · the mouse is released while panels are open</small></div>
<div id="loading">Loading Bellwether…</div>
<noscript>The Woods Remember needs JavaScript and WebGL.</noscript>
<script type="module" src="src/main.js"></script>
</body>
</html>
